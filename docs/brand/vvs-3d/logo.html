<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script src="three.min.js"></script>
<script>
(async function () {
  var P = new URLSearchParams(location.search), BG = P.get('bg') || 'stone', W = +(P.get('w') || 1600), H = +(P.get('h') || 900), YAW = +(P.get('yaw') || .32), PITCH = +(P.get('pitch') || .14);
  var M = await (await fetch('mark.json')).json();
  var canvas = document.getElementById('c'); canvas.width = W; canvas.height = H; canvas.style.width = W + 'px';
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: BG === 'clear', preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1;
  var scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(22, W / H, .1, 100), pmrem = new THREE.PMREMGenerator(renderer), V3 = THREE.Vector3;
  // ----- the grillz' lighting, copied from the Creator Lab (20-three.js) -----
  function equirect(w, h, fn) {
    var data = new Uint16Array(w * h * 4), hf = THREE.DataUtils.toHalfFloat, rgb = [0, 0, 0];
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) { var el = ((y + .5) / h - .5) * Math.PI, phi = ((x + .5) / w - .5) * Math.PI * 2; fn(el, phi, rgb); var k = (y * w + x) * 4; data[k] = hf(rgb[0]); data[k + 1] = hf(rgb[1]); data[k + 2] = hf(rgb[2]); data[k + 3] = hf(1); }
    var tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.HalfFloatType); tex.mapping = THREE.EquirectangularReflectionMapping; tex.magFilter = tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
    var out = pmrem.fromEquirectangular(tex).texture; tex.dispose(); return out;
  }
  function box(v, lo, hi, soft) { return Math.min(1, Math.max(0, (v - lo) / soft)) * Math.min(1, Math.max(0, (hi - v) / soft)); }
  var metalEnv = equirect(512, 256, function (el, phi, c) {
    var deg = Math.PI / 180, dx = Math.cos(phi) * Math.cos(el), dz = Math.sin(phi) * Math.cos(el), az = Math.abs(Math.atan2(dx, dz)) / deg, e = el / deg;
    var r = .05, g = .045, b = .04, up = Math.max(0, e) / 90; r += .16 * up; g += .16 * up; b += .17 * up;
    var top = box(e, 34, 88, 7) * box(az, -1, 96, 16) * 5.2; r += top; g += top * .98; b += top * .94;
    var card = box(e, -3, 24, 5) * box(az, -1, 46, 10) * 1.55; r += card; g += card * .97; b += card * .92;
    var strip = box(e, -28, 62, 4) * box(az, 62, 71, 1.5) * 9; r += strip; g += strip; b += strip;
    var rim = box(e, 6, 46, 5) * box(az, 138, 181, 8) * 3.4; r += rim; g += rim; b += rim * 1.04;
    var floor = box(e, -91, -18, 14) * .62; r += floor; g += floor * .84; b += floor * .62;
    c[0] = r; c[1] = g; c[2] = b;
  });
  var sparkleEnv = (function () {
    var seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }, lights = [], k;
    for (k = 0; k < 230; k++) { var tint = rnd(); lights.push([(rnd() - .5) * Math.PI * .96, (rnd() - .5) * Math.PI * 2, .03 + rnd() * .05, 7 + rnd() * 34, tint < .1 ? [.55, .8, 1.6] : tint < .2 ? [1.6, .95, .5] : [1, 1, 1]]); }
    return equirect(512, 256, function (el, phi, c) {
      var up = Math.max(0, el) / 1.57, r = .2 + .75 * up, g = .21 + .76 * up, b = .23 + .8 * up;
      for (var q = 0; q < lights.length; q++) { var L = lights[q], de = el - L[0], dp = Math.abs(phi - L[1]); if (dp > Math.PI) dp = 2 * Math.PI - dp; dp *= Math.cos(el); var d2 = (de * de + dp * dp) / (L[2] * L[2]); if (d2 < 6) { var w = Math.exp(-d2) * L[3]; r += w * L[4][0]; g += w * L[4][1]; b += w * L[4][2]; } }
      c[0] = r; c[1] = g; c[2] = b;
    });
  })();
  // ----- the grillz' materials: 14K yellow gold, 14K white gold, and the cut stones -----
  var gold = new THREE.MeshStandardMaterial({ color: new THREE.Color(1, .725, .315), metalness: 1, roughness: .17, envMap: metalEnv, envMapIntensity: 1, side: THREE.DoubleSide });
  var white = new THREE.MeshStandardMaterial({ color: new THREE.Color(.93, .92, .90), metalness: 1, roughness: .22, envMap: metalEnv, envMapIntensity: 1, side: THREE.DoubleSide });
  var diamond = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0, envMap: sparkleEnv, envMapIntensity: 2.1 });
  var gemGeo = (function () {
    var seg = 8, step = Math.PI * 2 / seg, tr = .6, th = .34, pos = [], mid = new V3(0, -.2, 0);
    function Pp(r, y, a) { return new V3(r * Math.cos(a), y, r * Math.sin(a)); }
    function tri(a, b, c) { var n = new V3().subVectors(b, a).cross(new V3().subVectors(c, a)), ctr = new V3().add(a).add(b).add(c).multiplyScalar(1 / 3).sub(mid); if (n.dot(ctr) < 0) { var t = b; b = c; c = t; } pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z); }
    for (var k = 0; k < seg; k++) { var t0 = Pp(tr, th, k * step), t1 = Pp(tr, th, (k + 1) * step), g0 = Pp(1, 0, (k - .5) * step), g1 = Pp(1, 0, (k + .5) * step); tri(new V3(0, th, 0), t0, t1); tri(t0, t1, g1); tri(t0, g1, g0); tri(g0, g1, Pp(1, -.3, (k + .5) * step)); tri(g0, Pp(1, -.3, (k + .5) * step), Pp(1, -.3, (k - .5) * step)); }
    var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); g.rotateX(Math.PI / 2); return g;   // table faces the viewer
  })();
  var beadGeo = new THREE.SphereGeometry(1, 14, 10);
  // ----- the mark: a height map traced from the logo, with side walls so it has real thickness -----
  var S = 4 / M.w, gw = M.gw, gh = M.gh, st = M.step, T = 7 * 2 * S;
  function X(i) { return (i * st - M.w / 2) * S; } function Y(j) { return -(j * st - M.h / 2) * S; }
  var idx = function (i, j) { return j * gw + i; }, inside = M.inside, pave = M.pave, hgt = M.height;
  var pos = new Float32Array(gw * gh * 3);
  for (var j = 0; j < gh; j++) for (var i = 0; i < gw; i++) { var k = idx(i, j); pos[k * 3] = X(i); pos[k * 3 + 1] = Y(j); pos[k * 3 + 2] = hgt[k] * S; }
  var triG = [], triW = [], edges = new Map();
  function addTri(list, a, b, c) { list.push(a, b, c); [[a, b], [b, c], [c, a]].forEach(function (e) { var key = e[0] < e[1] ? e[0] + '_' + e[1] : e[1] + '_' + e[0]; var v = edges.get(key); if (v) v.n++; else edges.set(key, { a: e[0], b: e[1], n: 1 }); }); }
  for (j = 0; j < gh - 1; j++) for (i = 0; i < gw - 1; i++) {
    var a = idx(i, j), b = idx(i + 1, j), c = idx(i, j + 1), d = idx(i + 1, j + 1);
    [[a, c, b], [b, c, d]].forEach(function (t) { if (inside[t[0]] && inside[t[1]] && inside[t[2]]) addTri(pave[t[0]] + pave[t[1]] + pave[t[2]] >= 2 ? triW : triG, t[0], t[1], t[2]); });
  }
  // walls: every edge used once is on the outline; drop it straight down by T
  var wall = [], wpos = [];
  edges.forEach(function (e) { if (e.n !== 1) return; var A = [pos[e.a * 3], pos[e.a * 3 + 1], pos[e.a * 3 + 2]], B = [pos[e.b * 3], pos[e.b * 3 + 1], pos[e.b * 3 + 2]]; wpos.push(A[0], A[1], A[2], B[0], B[1], B[2], B[0], B[1], -T, A[0], A[1], A[2], B[0], B[1], -T, A[0], A[1], -T); });
  function mesh(indices, mat) { var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(indices); g.computeVertexNormals(); return new THREE.Mesh(g, mat); }
  var mark = new THREE.Group(); scene.add(mark);
  mark.add(mesh(triG, gold)); mark.add(mesh(triW, white));
  var wg = new THREE.BufferGeometry(); wg.setAttribute('position', new THREE.Float32BufferAttribute(wpos, 3)); wg.computeVertexNormals(); mark.add(new THREE.Mesh(wg, gold));
  // stones and beads, set into the white-gold panels like an iced grill
  var plate = M.R * .62 * S, m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new V3();
  var gems = new THREE.InstancedMesh(gemGeo, diamond, M.stones.length);
  M.stones.forEach(function (s, n) { var r = s[2] * S * .98; q.setFromEuler(new THREE.Euler(0, 0, (n * 0.7) % 1)); m4.compose(new V3((s[0] - M.w / 2) * S, -(s[1] - M.h / 2) * S, plate + r * .3), q, sc.set(r, r, r)); gems.setMatrixAt(n, m4); });
  mark.add(gems);
  var beads = new THREE.InstancedMesh(beadGeo, white, M.beads.length);
  M.beads.forEach(function (b, n) { var r = M.stones[0][2] * S * .2; m4.compose(new V3((b[0] - M.w / 2) * S, -(b[1] - M.h / 2) * S, plate + r * .6), new THREE.Quaternion(), sc.set(r, r, r)); beads.setMatrixAt(n, m4); });
  mark.add(beads);
  // backdrop
  if (BG === 'stone') { var cv = document.createElement('canvas'); cv.width = cv.height = 512; var x = cv.getContext('2d'); var gr = x.createRadialGradient(256, 210, 0, 256, 256, 420); gr.addColorStop(0, '#f6f5f2'); gr.addColorStop(.55, '#e3e2dd'); gr.addColorStop(1, '#cfcec8'); x.fillStyle = gr; x.fillRect(0, 0, 512, 512); var tx = new THREE.CanvasTexture(cv); tx.encoding = THREE.sRGBEncoding; scene.background = tx; }
  else if (BG === 'ink') scene.background = new THREE.Color(0x121211);
  // turn the piece, not the camera, then frame its real bounds in the middle of the picture
  mark.rotation.y = -YAW; mark.rotation.x = PITCH;
  var dist = +(P.get('dist') || 7.0); camera.position.set(0, 0, dist); camera.lookAt(0, 0, 0); camera.updateMatrixWorld(); mark.updateMatrixWorld(true);
  var bb = new THREE.Box3().setFromObject(mark), ctr = bb.getCenter(new V3()); mark.position.sub(ctr); mark.updateMatrixWorld(true);
  renderer.render(scene, camera);
  window.DONE = true;
})();
</script></body></html>
