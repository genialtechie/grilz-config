name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit -p tsconfig.app.json
      # API functions run as Node ESM on Vercel: relative imports need .js extensions.
      - run: npx tsc -p tsconfig.vercel-check.json
      - run: npm test
      - run: npx vite build
  database:
    # Applies every migration to a fresh local Supabase and proves tenants can't
    # see each other's data. Fails the PR if a policy leaks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase start -x studio,realtime,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/isolation.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lead pipeline end to end (lead → render → photo → emails) with FLUX and Resend mocked.
      - name: Lead pipeline and dashboard integration tests
        run: |
          npx -y tsx@4.19.2 scripts/tenant-seed-sql.ts | psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q
          # pipeline.int.test.ts uses the gold-block demo shop for its cross-shop token check.
          npx -y tsx@4.19.2 scripts/demo-shops.ts | psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q
          export INTEGRATION_SUPABASE_URL=http://127.0.0.1:54321
          export INTEGRATION_SERVICE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          export INTEGRATION_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')
          npx vitest run server/__tests__/pipeline.int.test.ts server/__tests__/dashboard.int.test.ts server/__tests__/signup.int.test.ts server/__tests__/marketing.int.test.ts
      # Signup and team-invite emails: open the real emailed link in a fresh browser.
      - run: npx playwright install --with-deps chromium
      - name: Email sign-in links (e2e)
        run: |
          export INTEGRATION_SUPABASE_URL=http://127.0.0.1:54321
          export INTEGRATION_SERVICE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          export INTEGRATION_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')
          npx vitest run e2e/emailLinks.e2e.test.ts
      - if: always()
        run: supabase stop --no-backup
