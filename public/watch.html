<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3f0" />
    <meta
      name="description"
      content="See how Magpollo turns complex made-to-order products into a clear visual buying experience."
    />
    <meta property="og:title" content="Custom Product Configurator | Magpollo" />
    <meta
      property="og:description"
      content="A visual buying experience with guided customization, live pricing, and order-ready selections."
    />
    <meta
      property="og:image"
      content="https://commerce.magpollo.com/assets/og-commerce.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="video.other" />
    <meta property="og:url" content="https://commerce.magpollo.com/watch" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://commerce.magpollo.com/watch" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Custom Product Configurator | Magpollo</title>
    <style>
      :root {
        color: #251f17;
        background: #f5f3f0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      header {
        display: flex;
        align-items: center;
        height: 64px;
        padding: 0 24px;
        border-bottom: 1px solid #dedbd6;
        background: rgba(245, 243, 240, 0.96);
      }

      header a {
        display: inline-flex;
      }

      header img {
        width: 142px;
        height: auto;
      }

      main {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 54px 0 64px;
      }

      h1 {
        max-width: 780px;
        margin: 0 auto 14px;
        font-size: clamp(36px, 6vw, 64px);
        line-height: 1.02;
        letter-spacing: 0;
        text-align: center;
      }

      p {
        max-width: 680px;
        margin: 0 auto 34px;
        color: #625d56;
        font-size: 18px;
        line-height: 1.55;
        text-align: center;
      }

      .player {
        overflow: hidden;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid #dedbd6;
        border-radius: 8px;
        background: #251f17;
        box-shadow: 0 18px 50px rgba(37, 31, 23, 0.12);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .actions {
        display: flex;
        justify-content: center;
        margin-top: 24px;
      }

      .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 20px;
        border-radius: 6px;
        color: #fff;
        background: #ce4257;
        font-weight: 700;
        text-decoration: none;
      }

      .actions a:hover {
        background: #b9364b;
      }

      @media (max-width: 640px) {
        header {
          height: 58px;
          padding: 0 18px;
        }

        header img {
          width: 124px;
        }

        main {
          width: min(100% - 24px, 1080px);
          padding: 36px 0 48px;
        }

        h1 {
          font-size: 38px;
        }

        p {
          margin-bottom: 24px;
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="Magpollo Custom Commerce home">
        <img src="/assets/magpollo-logo.svg" alt="Magpollo" />
      </a>
    </header>
    <main>
      <h1>See custom commerce in action.</h1>
      <p>
        A quick look at how customers can configure a made-to-order product,
        see pricing update, and submit clear order details without the usual
        back-and-forth.
      </p>
      <div class="player">
        <iframe
          src="https://share.descript.com/embed/fN9LMDfJ41k"
          title="Magpollo custom product configurator walkthrough"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
      <div class="actions">
        <a href="/configurator">Try the configurator</a>
      </div>
    </main>
  </body>
</html>
